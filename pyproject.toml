[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archdoc"
version = "0.1.0"
description = "Interface-only architecture documentation: PlantUML diagrams and ICDs from code"
requires-python = ">=3.11"   # tomllib
dependencies = ["jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
archdoc = "archdoc.cli:main"

[tool.setuptools.packages.find]
include = ["archdoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"archdoc.render.icd" = ["templates/*/*.j2"]
